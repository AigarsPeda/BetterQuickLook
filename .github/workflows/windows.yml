name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Run automated checks
        run: dotnet run --project .\tests\BetterQuickLook.Tests.csproj -c Release -- --no-ui
      - name: Publish portable EXE
        run: dotnet publish .\src\BetterQuickLook.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\dist
      - uses: actions/upload-artifact@v7
        with:
          name: BetterQuickLook-win-x86
          path: dist/BetterQuickLook.exe
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x' # WiX 4 build tools
      - name: Check installer startup across upgrades
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\installer\obj\payload -Force | Out-Null
          Copy-Item .\dist\BetterQuickLook.exe .\installer\obj\payload\BetterQuickLook.exe
          $first = Join-Path $env:RUNNER_TEMP 'BetterQuickLook-installer-before'
          $next = Join-Path $env:RUNNER_TEMP 'BetterQuickLook-installer-after'
          dotnet build .\installer\BetterQuickLook.Setup.wixproj -c Release -p:AppVersion=1.0.0 -o $first
          if ($LASTEXITCODE -ne 0) { throw 'First installer build failed.' }
          # Changing AppVersion alone can reuse WiX's intermediate MSI.
          dotnet build .\installer\BetterQuickLook.Setup.wixproj -c Release --no-incremental -p:AppVersion=1.0.1 -o $next
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade installer build failed.' }
          .\tests\Test-Installer.ps1 -MsiPath (Join-Path $first 'BetterQuickLook-Setup.msi') -UpgradeMsiPath (Join-Path $next 'BetterQuickLook-Setup.msi')
