name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Run automated checks
        run: dotnet run --project .\tests\BetterQuickLook.Tests.csproj -c Release -- --no-ui
      - name: Publish portable EXE
        run: dotnet publish .\src\BetterQuickLook.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o .\dist
      - uses: actions/upload-artifact@v7
        with:
          name: BetterQuickLook-win-x86
          path: dist/BetterQuickLook.exe
